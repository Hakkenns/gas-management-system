spring.application.name=JPA_Ejercicios_Relacion

spring.datasource.url=jdbc:mysql://localhost:3306/sistema_gas
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Carpeta externa para almacenar imágenes de productos
app.product-images.dir=src/main/resources/static/imagenes-sistema
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB