<div th:fragment="barra_superior(empleadoId)">
    <div class="bg-dark text-white p-3 d-flex justify-content-between align-items-center shadow-sm">
        <div class="font-weight-bold"><i class="fas fa-gas-pump text-success"></i> FastFuel Delivery</div>
            <div class="d-flex align-items-center">
                <a href="#" onclick="event.preventDefault(); abrirModalEmergencia();" style="color: #dc3545 !important; font-size: 1.2rem; margin-right: 45px; display: inline-block;" title="Reportar Emergencia">
                    <i class="fas fa-exclamation-triangle"></i>
                </a>
<a href="#" onclick="event.preventDefault(); abrirModalRespuestas();" style="position: relative; color: #ffffff !important; font-size: 1.2rem; margin-right: 50px; display: inline-block;" title="Respuestas de Soporte">
                     <i class="fas fa-bell"></i>
                     <span id="badge-repartidor-notif" class="badge badge-danger position-absolute" th:text="${contadorIncidencias > 0 ? contadorIncidencias : ''}" style="top: -8px; right: -10px; font-size: 0.65rem; padding: 3px 6px; display: none;">0</span>
                 </a>
                <a th:href="@{/logout}" class="text-white" style="font-size: 0.9rem; border-left: 1px solid #6c757d; padding-left: 20px; display: inline-block;">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </div>
    </div>

    <!-- WebSocket Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var repartidorEmpleadoId = /*[[${empleadoId}]]*/ null;
        var respuestasNoLeidas = 0;

        // WebSocket para repartidor: suscribirse a respuestas de soporte
        function iniciarWebSocketRepartidor() {
            if (!repartidorEmpleadoId) return;
            
            try {
                const socket = new SockJS('/ws-repartidor');
                const stompClient = Stomp.over(socket);
                stompClient.debug = null;

                stompClient.connect({}, function(frame) {
                    console.log('WebSocket Repartidor conectado');

                    // Suscribirse al canal de respuestas del repartidor
                    stompClient.subscribe('/topic/repartidor/respuestas/' + repartidorEmpleadoId, function(message) {
                        const data = JSON.parse(message.body);
                        console.log('Nueva respuesta recibida:', data);
                        
                        // Verificar si el modal de soporte está abierto
                        const modal = document.getElementById('modal-respuestas-admin');
                        const modalAbierto = modal && modal.classList.contains('show');
                        
                        if (modalAbierto) {
                            // MODAL ABIERTO: inyectar directamente, SIN toast, SIN incrementar contador
                            agregarRespuestaAlModal(data);
                        } else {
                            // MODAL CERRADO: incrementar contador + mostrar toast flotante
                            respuestasNoLeidas++;
                            actualizarBadgeRespuestas();
                            mostrarToastRespuesta(data);
                        }
                    });
                }, function(error) {
                    console.error('Error WebSocket Repartidor:', error);
                    setTimeout(iniciarWebSocketRepartidor, 10000);
                });
            } catch (e) {
                console.error('Error al crear WebSocket Repartidor:', e);
                setTimeout(iniciarWebSocketRepartidor, 10000);
            }
        }

        // Actualizar badge de respuestas
        function actualizarBadgeRespuestas() {
            const badge = document.getElementById('badge-repartidor-notif');
            if (badge) {
                if (respuestasNoLeidas > 0) {
                    badge.textContent = respuestasNoLeidas;
                    badge.style.display = 'inline';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        // Agregar respuesta al modal en tiempo real
        function agregarRespuestaAlModal(data) {
            const container = document.getElementById('respuestas-container');
            if (!container) return;
            
            // Si no hay respuestas, limpiar el contenedor
            if (container.querySelector('.text-muted') && container.children.length === 1) {
                container.innerHTML = '';
            }
            
            const esCritica = data.tipoIncidencia === 'AVERIA_VEHICULO' || data.tipoIncidencia === 'ACCIDENTE';
            const icono = esCritica ? 'fa-exclamation-triangle text-danger' : 'fa-check-circle text-success';
            const tipoLabel = data.tipoIncidencia === 'AVERIA_VEHICULO' ? 'Avería de vehículo' :
                             data.tipoIncidencia === 'ACCIDENTE' ? 'Accidente en ruta' : 'Incidencia';
            
            const nuevaTarjeta = document.createElement('div');
            nuevaTarjeta.className = 'card shadow-sm mb-2 border-0';
            nuevaTarjeta.style.borderLeft = '4px solid ' + (esCritica ? '#dc3545' : '#28a745');
            nuevaTarjeta.innerHTML = 
                '<div class="card-body p-3">' +
                    '<div class="d-flex justify-content-between align-items-start">' +
                        '<div>' +
                            '<span class="font-weight-bold text-sm"><i class="fas ' + icono + ' mr-1"></i>' + tipoLabel + '</span>' +
                            '<p class="mb-1 mt-1"><strong>Mensaje:</strong> ' + (data.mensaje || 'Sin mensaje') + '</p>' +
                            (data.motoReemplazo ? '<p class="mb-1"><strong>Moto de reemplazo:</strong> ' + data.motoReemplazo + '</p>' : '') +
                            '<small class="text-muted">' + (data.fecha ? new Date(data.fecha).toLocaleString('es-PE') : '') + '</small>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            
            container.prepend(nuevaTarjeta);
        }

        // Inicializar WebSocket de repartidor si hay empleadoId
        if (repartidorEmpleadoId) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', iniciarWebSocketRepartidor);
            } else {
                iniciarWebSocketRepartidor();
            }
        }

        function abrirModalRespuestas() {
            if (!repartidorEmpleadoId) {
                if (typeof Swal !== 'undefined') {
                    Swal.fire({ title: 'Atención', text: 'No se pudo identificar al repartidor.', icon: 'warning' });
                }
                return;
            }

            // Resetear contador de respuestas no leídas a 0 y ocultar badge
            respuestasNoLeidas = 0;
            actualizarBadgeRespuestas();

            const container = document.getElementById('respuestas-container');
            if (!container) return;

            // Cargar respuestas desde el servidor
            fetch('/api/incidencias/repartidor/' + repartidorEmpleadoId + '/respuestas')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        container.innerHTML = '<p class="text-muted text-center">Error al cargar respuestas.</p>';
                        $('#modal-respuestas-admin').modal('show');
                        return;
                    }

                    const respuestas = data.respuestas || [];
                    if (respuestas.length === 0) {
                        container.innerHTML = '<p class="text-muted text-center">No hay respuestas de soporte aún.</p>';
                    } else {
                        let html = '';
                        respuestas.forEach(r => {
                            const esCritica = r.tipoIncidencia === 'AVERIA_VEHICULO' || r.tipoIncidencia === 'ACCIDENTE';
                            const icono = esCritica ? 'fa-exclamation-triangle text-danger' : 'fa-check-circle text-success';
                            const tipoLabel = r.tipoIncidencia === 'AVERIA_VEHICULO' ? 'Avería de vehículo' :
                                             r.tipoIncidencia === 'ACCIDENTE' ? 'Accidente en ruta' : 'Incidencia';
                            html += '<div class="card shadow-sm mb-2 border-0" style="border-left: 4px solid ' + (esCritica ? '#dc3545' : '#28a745') + ' !important;">' +
                                '<div class="card-body p-3">' +
                                    '<div class="d-flex justify-content-between align-items-start">' +
                                        '<div>' +
                                            '<span class="font-weight-bold text-sm"><i class="fas ' + icono + ' mr-1"></i>' + tipoLabel + '</span>' +
                                            '<p class="mb-1 mt-1"><strong>Mensaje:</strong> ' + (r.mensajeAuxilio || 'Sin mensaje') + '</p>' +
                                            (r.motoReemplazo ? '<p class="mb-1"><strong>Moto de reemplazo:</strong> ' + r.motoReemplazo + '</p>' : '') +
                                            '<small class="text-muted">' + (r.createdAt ? new Date(r.createdAt).toLocaleString('es-PE') : '') + '</small>' +
                                        '</div>' +
                                    '</div>' +
                                '</div>' +
                            '</div>';
                        });
                        container.innerHTML = html;
                    }

                    $('#modal-respuestas-admin').modal('show');
                })
                .catch(e => {
                    console.error('Error al cargar respuestas:', e);
                    container.innerHTML = '<p class="text-muted text-center">Error de conexión.</p>';
                    $('#modal-respuestas-admin').modal('show');
                });
        }
        // Inicializar badge siempre oculto y en 0 al cargar página
        // Solo se incrementa vía WebSocket al recibir nuevas respuestas
        document.addEventListener('DOMContentLoaded', function() {
            const badge = document.getElementById('badge-repartidor-notif');
            if (badge) {
                badge.textContent = '';
                badge.style.display = 'none';
            }
        });

        // ========== TOAST FLOTANTE PARA RESPUESTAS DE SOPORTE ==========
        // Contenedor de toasts (se crea solo una vez)
        var toastContainer = null;

        function asegurarToastContainer() {
            if (!toastContainer) {
                toastContainer = document.getElementById('toast-container-respuestas');
                if (!toastContainer) {
                    toastContainer = document.createElement('div');
                    toastContainer.id = 'toast-container-respuestas';
                    document.body.appendChild(toastContainer);
                }
            }
            return toastContainer;
        }

        function mostrarToastRespuesta(data) {
            var container = asegurarToastContainer();
            if (!container) return;

            var esCritica = data.tipoIncidencia === 'AVERIA_VEHICULO' || data.tipoIncidencia === 'ACCIDENTE';
            var tipoLabel = data.tipoIncidencia === 'AVERIA_VEHICULO' ? 'Avería de vehículo' :
                            data.tipoIncidencia === 'ACCIDENTE' ? 'Accidente en ruta' : 'Incidencia';

            var toast = document.createElement('div');
            toast.className = 'toast-respuesta show-slide';
            toast.style.borderLeftColor = esCritica ? '#dc3545' : '#28a745';
            toast.setAttribute('data-mensaje', data.mensaje || '');
            toast.innerHTML =
                '<div class="toast-respuesta-icon"><i class="fas ' + (esCritica ? 'fa-exclamation-triangle' : 'fa-headset') + '"></i></div>' +
                '<div class="toast-respuesta-content">' +
                    '<div class="toast-respuesta-title">Nueva respuesta de soporte</div>' +
                    '<p class="toast-respuesta-text"><strong>' + tipoLabel + '</strong> - ' + (data.mensaje || 'El administrador ha respondido tu incidencia.') + '</p>' +
                '</div>';

            // CLIC PARA ABRIR: al tocar, abre el modal de soporte y elimina el toast
            toast.addEventListener('click', function(e) {
                e.preventDefault();
                // Cerrar toast con animación
                toast.classList.remove('show-slide');
                toast.classList.add('hide-slide');
                setTimeout(function() {
                    if (toast.parentNode) toast.remove();
                }, 400);
                // Abrir la bandeja de soporte
                if (typeof abrirModalRespuestas === 'function') {
                    abrirModalRespuestas();
                }
            });

            // GESTO DE DESLIZAR (Swipe to Dismiss)
            var startX = 0;
            var currentX = 0;
            var isDragging = false;

            toast.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                isDragging = true;
                toast.style.transition = 'none';
            }, { passive: true });

            toast.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                currentX = e.touches[0].clientX;
                var diff = currentX - startX;
                if (diff > 0) {
                    toast.style.transform = 'translateX(' + diff + 'px)';
                    toast.style.opacity = Math.max(0, 1 - (diff / 250));
                }
            }, { passive: true });

            toast.addEventListener('touchend', function(e) {
                if (!isDragging) return;
                isDragging = false;
                var diff = currentX - startX;
                toast.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                if (diff > 100) {
                    // Deslizó lo suficiente → descartar
                    toast.style.transform = 'translateX(100%)';
                    toast.style.opacity = '0';
                    setTimeout(function() {
                        if (toast.parentNode) toast.remove();
                    }, 300);
                } else {
                    // Volver a la posición original
                    toast.style.transform = 'translateX(0)';
                    toast.style.opacity = '1';
                }
            }, { passive: true });

            container.appendChild(toast);

            // Auto-eliminar después de 8 segundos
            setTimeout(function() {
                if (toast.parentNode) {
                    toast.classList.remove('show-slide');
                    toast.classList.add('hide-slide');
                    setTimeout(function() {
                        if (toast.parentNode) toast.remove();
                    }, 400);
                }
            }, 8000);
        }

        // ========== LIMPIEZA DE BANDEJA AL CERRAR MODAL (Opción B) ==========
        // Cuando el modal de respuestas se cierra (por 'X' o clic fuera), se limpia el contenido HTML
        // de la lista de mensajes y se marcan todas como LEÍDAS en el backend para que
        // nunca más vuelvan a aparecer en la bandeja.
        document.addEventListener('DOMContentLoaded', function() {
            var modal = document.getElementById('modal-respuestas-admin');
            if (modal) {
                // Escuchar el evento 'hidden.bs.modal' de Bootstrap (se dispara cuando el modal termina de ocultarse)
                $(modal).on('hidden.bs.modal', function() {
                    // 1) Limpiar completamente el contenido HTML interno de la lista de mensajes
                    var container = document.getElementById('respuestas-container');
                    if (container) {
                        container.innerHTML = '<p class="text-muted text-center">No hay respuestas de soporte aún.</p>';
                    }
                    // 2) Resetear el contador de no leídas
                    respuestasNoLeidas = 0;
                    actualizarBadgeRespuestas();
                    // 3) Marcar todas las respuestas como LEÍDAS en el backend (fetch)
                    if (repartidorEmpleadoId) {
                        fetch('/api/incidencias/repartidor/' + repartidorEmpleadoId + '/respuestas/marcar-leidas', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        }).catch(function(e) {
                            console.error('Error al marcar respuestas como leídas:', e);
                        });
                    }
                });
            }
        });

        /*]]>*/
    </script>

    <style>
        /* Contenedor de toasts de respuestas */
        #toast-container-respuestas {
            position: fixed;
            bottom: 80px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            pointer-events: none;
        }
        #toast-container-respuestas .toast-respuesta {
            pointer-events: auto;
        }
        .toast-respuesta {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            border-left: 5px solid #28a745;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: toastRespuestaShow 0.4s ease forwards;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }
        .toast-respuesta:hover {
            box-shadow: 0 10px 35px rgba(0,0,0,0.18);
        }
        .toast-respuesta:active {
            transform: scale(0.98);
        }
        .toast-respuesta-icon {
            font-size: 1.3rem;
            color: #28a745;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .toast-respuesta-content {
            flex: 1;
            min-width: 0;
        }
        .toast-respuesta-title {
            font-weight: 700;
            font-size: 0.85rem;
            color: #212529;
            margin-bottom: 2px;
        }
        .toast-respuesta-text {
            font-size: 0.78rem;
            color: #6c757d;
            margin: 0;
            line-height: 1.3;
        }
        .toast-respuesta.show-slide {
            animation: toastRespuestaShow 0.4s ease forwards;
        }
        .toast-respuesta.hide-slide {
            animation: toastRespuestaHide 0.4s ease forwards;
        }
        @keyframes toastRespuestaShow {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes toastRespuestaHide {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }
    </style>

    <!-- Modal de Respuestas de Soporte (Repartidor) -->
    <div class="modal fade" id="modal-respuestas-admin" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h6 class="modal-title"><i class="fas fa-headset"></i> Respuestas de Soporte</h6>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="respuestas-container">
                        <p class="text-muted text-center">No hay respuestas de soporte aún.</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
