<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar datos personales</title>
    <link rel="stylesheet" href="dist/css/adminlte.min.css">
    <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="plugins/sweetalert2/sweetalert2.min.css">
    <style>
        body { padding-bottom: 85px !important; background-color: #f8f9fc; }
        .bottom-nav-custom { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #ffffff; display: flex; justify-content: space-around; padding: 12px 0 8px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top-left-radius: 25px; border-top-right-radius: 25px; z-index: 1050; }
        .bottom-nav-custom a { text-align: center; text-decoration: none !important; color: #8b92a5; font-size: 0.75rem; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bottom-nav-custom a i { font-size: 1.4rem; padding: 6px 20px; border-radius: 14px; }
        .bottom-nav-custom a.active { color: #05a660; font-weight: 700; }
        .bottom-nav-custom a.active i { background-color: #e8f7f0; color: #05a660; }
    </style>
</head>
<body>
<div th:fragment="content">
    <div class="bg-dark text-white p-3 d-flex justify-content-between align-items-center shadow-sm">
        <a href="perfil.html" class="text-white"><i class="fas fa-arrow-left"></i></a>
        <div class="font-weight-bold">Editar perfil</div>
        <div class="text-white-50 small">Datos</div>
    </div>

    <div class="content p-3 pb-5">
        <div class="card shadow-sm border-0 rounded-lg mb-3">
            <div class="card-body p-3">
                <h6 class="font-weight-bold text-dark mb-1">Datos personales</h6>
                <p class="text-muted small mb-0">Tu DNI no se puede modificar, pero puedes actualizar tu teléfono, dirección y correo.</p>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-lg mb-4">
            <div class="card-body p-3">
                <div class="form-group mb-3">
                    <label class="text-xs text-muted font-weight-bold">Nombre completo</label>
                    <input type="text" class="form-control" value="Roy Agapito Vegas">
                </div>

                <div class="form-group mb-3">
                    <label class="text-xs text-muted font-weight-bold">DNI</label>
                    <input type="text" class="form-control" value="76458213" disabled>
                </div>

                <div class="form-group mb-3">
                    <label class="text-xs text-muted font-weight-bold">Teléfono</label>
                    <input type="tel" class="form-control" value="987654321">
                </div>

                <div class="form-group mb-3">
                    <label class="text-xs text-muted font-weight-bold">Dirección</label>
                    <input type="text" class="form-control" value="Av. Central 123, Lima">
                </div>

                <div class="form-group mb-0">
                    <label class="text-xs text-muted font-weight-bold">Correo</label>
                    <input type="email" class="form-control" value="roy@example.com">
                </div>
            </div>
        </div>

        <button class="btn btn-success btn-block font-weight-bold shadow-sm" onclick="guardarDatos()">
            <i class="fas fa-save"></i> Guardar cambios
        </button>
        <a href="perfil.html" class="btn btn-outline-secondary btn-block font-weight-bold mt-2">Cancelar</a>
    </div>

    <nav class="bottom-nav-custom">
        <a href="asignados.html"><i class="fas fa-truck-fast"></i><span>Asignados</span></a>
        <a href="historial.html"><i class="fas fa-clock-rotate-left"></i><span>Historial</span></a>
        <a href="perfil.html" class="active"><i class="far fa-user"></i><span>Perfil</span></a>
    </nav>

    <script>
        function guardarDatos() {
            Swal.fire({
                icon: 'success',
                title: 'Datos actualizados',
                text: 'La información personal se guardó correctamente.',
                showConfirmButton: false,
                allowOutsideClick: true,
                allowEscapeKey: true,
                timer: 1500,
                timerProgressBar: true,
                didClose: function () {
                    window.location.href = 'perfil.html';
                }
            });
        }
    </script>
    <script src="plugins/jquery/jquery.min.js"></script>
    <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="plugins/sweetalert2/sweetalert2.min.js"></script>
    <script src="dist/js/adminlte.min.js"></script>
</div>
</body>
</html>
