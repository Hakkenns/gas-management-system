<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar datos personales</title>
    <link rel="stylesheet" th:href="@{/assets/adminlte/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/assets/adminlte/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/assets/adminlte/plugins/sweetalert2/sweetalert2.min.css}">
    <style>
        body { padding-bottom: 85px !important; background-color: #f8f9fc; }
        .bottom-nav-custom { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #ffffff; display: flex; justify-content: space-around; padding: 12px 0 8px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top-left-radius: 25px; border-top-right-radius: 25px; z-index: 1050; }
        .bottom-nav-custom a { text-align: center; text-decoration: none !important; color: #8b92a5; font-size: 0.75rem; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bottom-nav-custom a i { font-size: 1.4rem; padding: 6px 20px; border-radius: 14px; }
        .bottom-nav-custom a.active { color: #05a660; font-weight: 700; }
        .bottom-nav-custom a.active i { background-color: #e8f7f0; color: #05a660; }
    </style>
</head>
<body>
<div th:fragment="content">
    <div class="bg-dark text-white p-3 d-flex justify-content-between align-items-center shadow-sm">
        <a th:href="@{/motorizado/perfil}" class="text-white"><i class="fas fa-arrow-left"></i></a>
        <div class="font-weight-bold">Editar perfil</div>
        <div class="text-white-50 small">Datos</div>
    </div>

    <div class="content p-3 pb-5">
        <div class="card shadow-sm border-0 rounded-lg mb-3">
            <div class="card-body p-3">
                <h6 class="font-weight-bold text-dark mb-1">Datos personales</h6>
                <p class="text-muted small mb-0">Tu DNI no se puede modificar, pero puedes actualizar tu teléfono y correo electrónico.</p>
            </div>
        </div>

        <form id="perfilForm" th:action="@{/motorizado/perfil/actualizar}" th:object="${empleado}" method="post" class="w-100">
            <div class="card shadow-sm border-0 rounded-lg mb-4">
                <div class="card-body p-3">
                    <div class="form-group mb-3">
                        <label class="text-xs text-muted font-weight-bold">Nombre completo</label>
                        <input type="text" class="form-control" th:field="*{nombre}" readonly>
                    </div>

                    <div class="form-group mb-3">
                        <label class="text-xs text-muted font-weight-bold">DNI</label>
                        <input type="text" class="form-control" th:field="*{dni}" readonly>
                    </div>

                    <div class="form-group mb-3">
                        <label class="text-xs text-muted font-weight-bold">Teléfono</label>
                        <input type="tel" class="form-control" th:field="*{telefono}" maxlength="9" pattern="^9\d{8}$" required>
                    </div>

                    <div class="form-group mb-0">
                        <label class="text-xs text-muted font-weight-bold">Correo electrónico</label>
                        <input type="email" class="form-control" th:field="*{correo}" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-block font-weight-bold shadow-sm">
                <i class="fas fa-save"></i> Guardar cambios
            </button>
            <a th:href="@{/motorizado/perfil}" class="btn btn-outline-secondary btn-block font-weight-bold mt-2">Cancelar</a>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('perfilForm');
            if (!form) return;

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const formData = new FormData(form);
                const params = new URLSearchParams(formData);

                fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: params.toString()
                })
                .then(async response => {
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        const firstError = data.errors
                            ? Object.values(data.errors)[0]
                            : (data.message || 'No se pudieron guardar los cambios');
                        throw new Error(firstError);
                    }

                    Swal.fire({
                        icon: 'success',
                        title: '¡Cambios Guardados!',
                        text: data.message || 'Tu perfil se actualizó correctamente.',
                        confirmButtonText: 'Aceptar'
                    }).then(() => {
                        window.location.href = '/motorizado/perfil';
                    });
                })
                .catch(error => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: error.message || 'Ocurrió un problema al guardar los cambios.'
                    });
                });
            });
        });
    </script>
    <script th:src="@{/assets/adminlte/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/assets/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/assets/adminlte/plugins/sweetalert2/sweetalert2.min.js}"></script>
    <script th:src="@{/assets/adminlte/dist/js/adminlte.min.js}"></script>
    <div th:replace="~{fragments/bottom-nav :: menú}"></div>
</div>
</body>
</html>
