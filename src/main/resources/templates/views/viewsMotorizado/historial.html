<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Entregas</title>
    <link rel="stylesheet" href="dist/css/adminlte.min.css">
    <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
    <style>
        body { padding-bottom: 85px !important; background-color: #f8f9fc; }
        .bottom-nav-custom { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #ffffff; display: flex; justify-content: space-around; padding: 12px 0 8px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); border-top-left-radius: 25px; border-top-right-radius: 25px; z-index: 1050; }
        .bottom-nav-custom a { text-align: center; text-decoration: none !important; color: #8b92a5; font-size: 0.75rem; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bottom-nav-custom a i { font-size: 1.4rem; padding: 6px 20px; border-radius: 14px; }
        .bottom-nav-custom a.active { color: #05a660; font-weight: 700; }
        .bottom-nav-custom a.active i { background-color: #e8f7f0; color: #05a660; }
    </style>
</head>
<body>
<div th:fragment="content">

    <div class="bg-dark text-white p-3 d-flex justify-content-between align-items-center shadow-sm">
        <div class="font-weight-bold"><i class="fas fa-gas-pump text-success"></i> FastFuel Delivery</div>
        <div class="text-white-50 small">Sist. Web</div>
    </div>

    <div class="content p-2 pb-5 mt-2">
        <div class="input-group mb-3 shadow-sm rounded">
            <div class="input-group-prepend"><span class="input-group-text bg-white border-right-0 border-light"><i class="fas fa-search text-muted"></i></span></div>
            <input type="text" class="form-control border-left-0 border-light" placeholder="Buscar por ID o cliente...">
        </div>

        <div class="d-flex mb-3" style="overflow-x: auto; white-space: nowrap;">
            <button class="btn btn-success btn-sm rounded-pill mr-2 px-3 font-weight-bold"><i class="far fa-calendar-alt"></i> Hoy</button>
            <button class="btn btn-outline-secondary btn-sm rounded-pill mr-2 px-3 bg-white text-dark border-light shadow-sm"><i class="fas fa-sync-alt"></i> Esta semana</button>
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 bg-white text-dark border-light shadow-sm"><i class="fas fa-sliders-h"></i> Filtros</button>
        </div>

        <div class="row mb-3">
            <div class="col-6 pr-1">
                <div class="card bg-success mb-0 shadow-sm border-0 rounded-lg">
                    <div class="card-body p-2 text-center"><span class="d-block text-xs font-weight-bold">COMPLETADOS</span><h4 class="m-0 font-weight-bold">25</h4></div>
                </div>
            </div>
            <div class="col-6 pl-1">
                <div class="card mb-0 shadow-sm border-0 rounded-lg">
                    <div class="card-body p-2 text-center"><span class="d-block text-xs font-weight-bold text-muted">TOTAL RECAUDADO</span><h4 class="m-0 font-weight-bold text-success">S/ 2,465.50</h4></div>
                </div>
            </div>
        </div>

        <h6 class="text-muted font-weight-bold text-xs mb-2">HISTORIAL RECIENTE</h6>

        <a href="venta-detalle.html" class="text-dark text-decoration-none">
          <div class="card shadow-sm mb-2 border-0 rounded-lg">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                    <span class="font-weight-bold text-sm">NV001-0005</span>
                    <span class="badge badge-success px-2 py-1"><i class="fas fa-check"></i> ENTREGADO</span>
                </div>
                <div class="d-flex justify-content-between align-items-end">
                    <div>
                        <h6 class="m-0 font-weight-bold">Maria Rodriguez</h6>
                        <small class="text-muted"><i class="far fa-calendar-alt"></i> 09/06/2026</small>
                    </div>
                    <div class="text-right">
                        <h6 class="m-0 font-weight-bold text-success">S/ 45.00</h6>
                        <span class="badge border border-warning text-warning mt-1 px-2" style="background-color: #fff9e6;">● YAPE | EFECTIVO</span>
                    </div>
                </div>
            </div>
          </div>
        </a>

        <a href="venta-detalle.html" class="text-dark text-decoration-none">
          <div class="card shadow-sm mb-2 border-0 rounded-lg">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                    <span class="font-weight-bold text-sm">NV001-0004</span>
                    <span class="badge badge-success px-2 py-1"><i class="fas fa-check"></i> ENTREGADO</span>
                </div>
                <div class="d-flex justify-content-between align-items-end">
                    <div>
                        <h6 class="m-0 font-weight-bold">Carlos Rodriguez Pérez</h6>
                        <small class="text-muted"><i class="far fa-calendar-alt"></i> 09/06/2026</small>
                    </div>
                    <div class="text-right">
                        <h6 class="m-0 font-weight-bold text-success">S/ 450.00</h6>
                        <span class="badge border border-success text-success mt-1 px-2" style="background-color: #e8f7f0;">● EFECTIVO</span>
                    </div>
                </div>
            </div>
          </div>
        </a>
    </div>

    <nav class="bottom-nav-custom">
        <a href="asignados.html"><i class="fas fa-truck-fast"></i><span>Asignados</span></a>
        <a href="historial.html" class="active"><i class="fas fa-clock-rotate-left"></i><span>Historial</span></a>
        <a href="perfil.html"><i class="far fa-user"></i><span>Perfil</span></a>
    </nav>

    <script src="plugins/jquery/jquery.min.js"></script>
    <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="dist/js/adminlte.min.js"></script>
</div>
</body>
</html>
