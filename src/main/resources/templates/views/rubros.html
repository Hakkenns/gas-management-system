<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content" data-modulo="rubros" data-page-title="Gestion de Rubros">

        <div class="content p-3">
            <h3>
                <i class="fas fa-tags"></i>
                <strong>Gestión de Rubros</strong>
            </h3>
            <hr>

            <button id="btn-crear-rubro" class="btn btn-info mb-3">
                <i class="fas fa-plus"></i>
                Nuevo Rubro
            </button>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 p-2 bg-light rounded border">
                <!-- Selector de registros por página (izquierda) -->
                <div class="d-flex align-items-center">
                    <label class="mr-2 mb-0 font-weight-bold text-sm">Mostrar</label>
                    <select id="rubros-length" class="form-control form-control-sm" style="width: auto;">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="40">40</option>
                        <option value="50">50</option>
                    </select>
                    <span class="ml-2 mb-0 text-sm">registros</span>
                </div>

                <!-- Buscador (derecha) -->
                <div class="d-flex align-items-center ml-auto mt-2 mt-md-0">
                    <label class="mr-2 mb-0 font-weight-bold text-sm">Buscar:</label>
                    <input type="search" id="rubros-search" class="form-control form-control-sm" style="width: 200px;">
                </div>
            </div>

            <div id="contenedor-tabla">
                <table class="table table-bordered table-striped" id="tabla-rubros">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-rubros-body" th:fragment="tablaRubros">
                        <tr th:if="${#lists.isEmpty(rubros)}">
                            <td colspan="5" class="text-center">No hay rubros registrados</td>
                        </tr>
                        <tr th:each="r : ${rubros}">
                            <td th:text="${r.id}"></td>
                            <td th:text="${r.nombre}"></td>
                            <td th:text="${r.descripcion}"></td>
                            <td>
                                <span class="badge badge-success" th:if="${r.estado == 1}">ACTIVO</span>
                                <span class="badge badge-danger" th:if="${r.estado == 0}">INACTIVO</span>
                            </td>
                            <td>
                                <button class="btn btn-warning btn-sm btn-editar-rubro" th:data-id="${r.id}"
                                    title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <button th:if="${r.estado == 1}" class="btn btn-secondary btn-sm btn-estado-rubro"
                                    th:data-id="${r.id}" th:data-estado="0" title="Inhabilitar">
                                    <i class="fas fa-ban"></i>
                                </button>

                                <button th:if="${r.estado == 0}" class="btn btn-success btn-sm btn-estado-rubro"
                                    th:data-id="${r.id}" th:data-estado="1" title="Activar">
                                    <i class="fas fa-check"></i>
                                </button>

                                <button class="btn btn-danger btn-sm btn-eliminar-rubro" th:data-id="${r.id}"
                                    title="Eliminar">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal fade" id="modal-rubro" tabindex="-1" data-backdrop="false">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-dark">
                        <h5 class="modal-title text-white" id="modal-titulo-rubro">Nuevo Rubro</h5>
                        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <form id="form-rubro">
                            <input type="hidden" id="id-rubro" name="id">

                            <div class="form-group">
                                <label>Nombre del Rubro</label>
                                <input type="text" class="form-control" id="nombre-rubro" name="nombre" required>
                            </div>

                            <div class="form-group mt-2">
                                <label>Descripción</label>
                                <textarea class="form-control" id="descripcion-rubro" name="descripcion"></textarea>
                            </div>

                            <div class="text-right mt-4">
                                <button type="submit" class="btn btn-info">Guardar</button>
                                <button type="button" id="btn-cancelar-rubro" class="btn btn-secondary"
                                    data-dismiss="modal">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>


        <script th:src="@{/assets/js/rubro.js}"></script>
    </div>
</body>

</html>
