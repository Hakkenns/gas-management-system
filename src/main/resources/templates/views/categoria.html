<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="content">

        <div class="content p-3">

            <h3>
                <i class="fas fa-tags"></i>
                <strong>Gestión de Categorías</strong>
            </h3>

            <hr>

            <button id="btn-crear-categoria" class="btn btn-info mb-3" data-toggle="modal"
                data-target="#modal-categoria">
                <i class="fas fa-plus"></i>
                Nueva Categoría
            </button>

            <div id="contenedor-tabla-categoria" th:fragment="tablaCategorias">

                <table class="table table-bordered table-striped">

                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Medida Base</th> <!-- Informativo para control del dueño -->
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="6" class="text-center">
                                No hay categorías registradas
                            </td>
                        </tr>

                        <tr th:each="c : ${categorias}">

                            <td th:text="${c.id}"></td>
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.descripcion}"></td>

                            <!-- Columna visual para ver la unidad configurada internamente -->
                            <td>
                                <span class="badge badge-light" th:text="${c.unidadMedida}"></span>
                            </td>

                            <td>
                                <span class="badge badge-success" th:if="${c.estado == 1}">
                                    ACTIVO
                                </span>
                                <span class="badge badge-danger" th:if="${c.estado == 0}">
                                    INACTIVO
                                </span>
                            </td>

                            <td>
                                <!-- NUEVO: Atributo data-tipounidad calculado dinámicamente según la regla inversa -->
                                <button type="button" class="btn btn-warning btn-sm btn-editar-categoria"
                                    th:attr="data-id=${c.id},
                                             data-nombre=${c.nombre},
                                             data-descripcion=${c.descripcion},
                                             data-tipounidad=${c.unidadMedida == 'KG' ? 'POR KILOS (KG)' : 
                                                              (c.unidadMedida == 'L' ? 'POR LITROS (L)' : 
                                                              (c.unidadMedida == 'M' ? 'POR METROS (M)' : 'POR UNIDADES / PIEZAS'))}">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <button type="button" class="btn btn-danger btn-sm btn-eliminar-categoria"
                                    th:attr="data-id=${c.id}">
                                    <i class="fas fa-trash"></i>
                                </button>

                                <button type="button" class="btn btn-secondary btn-sm btn-cambiar-estado-categoria"
                                    th:if="${c.estado == 1}" th:attr="data-id=${c.id},data-estado=0">
                                    <i class="fas fa-ban"></i>
                                </button>

                                <button type="button" class="btn btn-success btn-sm btn-cambiar-estado-categoria"
                                    th:if="${c.estado == 0}" th:attr="data-id=${c.id},data-estado=1">
                                    <i class="fas fa-check"></i>
                                </button>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>
        </div>

        <div class="modal fade" id="modal-categoria" tabindex="-1" data-backdrop="false">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header bg-dark">
                        <h5 class="modal-title text-white" id="modal-titulo-categoria">
                            Nueva Categoría
                        </h5>
                        <button type="button" class="close text-white" data-dismiss="modal">
                            &times;
                        </button>
                    </div>

                    <div class="modal-body">

                        <form th:action="@{/categorias}" method="post" id="form-categoria">

                            <input type="hidden" id="categoria-id" name="id">

                            <div class="form-group">
                                <label>Nombre de Categoría</label>
                                <input type="text" class="form-control" id="nombre-categoria" name="nombre" required>
                            </div>

                            <div class="form-group mt-2">
                                <label for="tipoUnidad" class="form-label">Forma de Venta / Tipo de Unidad</label>
                                <select class="form-control" id="tipoUnidad" name="tipoUnidad" required>
                                    <option value="" disabled selected>-- Seleccione una opción --</option>
                                    <option value="POR UNIDADES / PIEZAS">Por Unidades / Piezas</option>
                                    <option value="POR KILOS (KG)">Por Kilos (KG)</option>
                                    <option value="POR LITROS (L)">Por Litros (L)</option>
                                    <option value="POR METROS (M)">Por Metros (M)</option>
                                </select>
                            </div>

                            <div class="form-group mt-2">
                                <label>Descripción</label>
                                <textarea class="form-control" id="descripcion-categoria" name="descripcion"></textarea>
                            </div>

                            <div class="text-right mt-4">
                                <button type="submit" class="btn btn-info">
                                    Guardar
                                </button>
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                                    Cancelar
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

        <script th:src="@{/assets/js/categoria.js}"></script>

    </div>

</body>

</html>
