<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="content">

    <div class="content p-3">

        <h3>
            <i class="fas fa-tags"></i>
            <strong>Gestión de Categorías</strong>
        </h3>

        <hr>

        <!-- BOTON NUEVA CATEGORIA -->
        <button id="btn-crear-categoria"
                class="btn btn-info mb-3"
                data-toggle="modal"
                data-target="#modal-categoria">

            <i class="fas fa-plus"></i>
            Nueva Categoría

        </button>

        <!-- TABLA -->
        <table class="table table-bordered table-striped">

            <thead class="thead-dark">

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <!-- SI NO HAY DATOS -->
                <tr th:if="${#lists.isEmpty(categorias)}">

                    <td colspan="5"
                        class="text-center">

                        No hay categorías registradas

                    </td>

                </tr>

                <!-- LISTAR -->
                <tr th:each="c : ${categorias}">

                    <td th:text="${c.id}"></td>

                    <td th:text="${c.nombre}"></td>

                    <td th:text="${c.descripcion}"></td>

                    <!-- ESTADO -->
                    <td>

                        <span class="badge badge-success"
                              th:if="${c.estado == 1}">

                            ACTIVO

                        </span>

                        <span class="badge badge-danger"
                              th:if="${c.estado == 0}">

                            INACTIVO

                        </span>

                    </td>

                    <!-- ACCIONES -->
                    <td>

                        <!-- EDITAR -->
                        <button class="btn btn-warning btn-sm btn-editar-categoria"

                                th:data-id="${c.id}"
                                th:data-nombre="${c.nombre}"
                                th:data-descripcion="${c.descripcion}">

                            <i class="fas fa-edit"></i>

                        </button>

                        <!-- ELIMINAR -->
                        <a th:href="@{/categorias/eliminar/{id}(id=${c.id})}"
                           class="btn btn-danger btn-sm">

                            <i class="fas fa-trash"></i>

                        </a>

                        <!-- CAMBIAR ESTADO -->
                        <a th:if="${c.estado == 1}"
                           th:href="@{/categorias/estado/{id}/{estado}(id=${c.id},estado=0)}"
                           class="btn btn-secondary btn-sm">

                            <i class="fas fa-ban"></i>

                        </a>

                        <a th:if="${c.estado == 0}"
                           th:href="@{/categorias/estado/{id}/{estado}(id=${c.id},estado=1)}"
                           class="btn btn-success btn-sm">

                            <i class="fas fa-check"></i>

                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- MODAL -->
    <div class="modal fade"
         id="modal-categoria"
         tabindex="-1"
         data-backdrop="false">

        <div class="modal-dialog">

            <div class="modal-content">

                <!-- HEADER -->
                <div class="modal-header bg-dark">

                    <h5 class="modal-title text-white"
                        id="modal-titulo-categoria">

                        Nueva Categoría

                    </h5>

                    <button type="button"
                            class="close text-white"
                            data-dismiss="modal">

                        &times;

                    </button>

                </div>

                <!-- BODY -->
                <div class="modal-body">

                    <form th:action="@{/categorias}"
                          method="post"
                          id="form-categoria">

                        <!-- ID -->
                        <input type="hidden"
                               id="categoria-id"
                               name="id">

                        <!-- NOMBRE -->
                        <div class="form-group">

                            <label>Nombre de Categoría</label>

                            <input type="text"
                                   class="form-control"
                                   id="nombre-categoria"
                                   name="nombre"
                                   required>

                        </div>

                        <!-- DESCRIPCION -->
                        <div class="form-group mt-2">

                            <label>Descripción</label>

                            <textarea class="form-control"
                                      id="descripcion-categoria"
                                      name="descripcion"></textarea>

                        </div>

                        <!-- BOTONES -->
                        <div class="text-right mt-4">

                            <button type="submit"
                                    class="btn btn-info">

                                Guardar

                            </button>

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-dismiss="modal">

                                Cancelar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script th:src="@{/assets/js/categoria.js}"></script>

</div>

</body>
</html>
