<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="content">

    <div class="content p-3">

        <h3>
            <i class="fas fa-tags"></i>
            <strong>Gestión de Categorías</strong>
        </h3>

        <hr>

        <button class="btn btn-info mb-3"
                data-toggle="modal"
                data-target="#modal-categoria">

            <i class="fas fa-plus"></i>
            Nueva Categoría

        </button>

        <table class="table table-bordered table-striped">

            <thead class="thead-dark">

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody>

                <tr th:if="${#lists.isEmpty(categorias)}">

                    <td colspan="5" class="text-center">
                        No hay categorías registradas.
                    </td>

                </tr>

                <tr th:each="c : ${categorias}">

                    <td th:text="${c.id}"></td>

                    <td th:text="${c.nombre}"></td>

                    <td th:text="${c.descripcion}"></td>

                    <td>

                        <span th:if="${c.estado == 1}"
                              class="badge badge-success">

                            ACTIVO

                        </span>

                        <span th:if="${c.estado == 0}"
                              class="badge badge-danger">

                            INACTIVO

                        </span>

                    </td>

                    <td>

                        <button class="btn btn-warning btn-sm">

                            <i class="fas fa-edit"></i>

                        </button>

                        <button class="btn btn-danger btn-sm">

                            <i class="fas fa-trash"></i>

                        </button>

                        <button th:if="${c.estado == 1}"
                                class="btn btn-secondary btn-sm">

                            <i class="fas fa-ban"></i>

                        </button>

                        <button th:if="${c.estado == 0}"
                                class="btn btn-success btn-sm">

                            <i class="fas fa-check"></i>

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <!-- MODAL -->

    <div class="modal fade"
         id="modal-categoria"
         tabindex="-1"
         data-backdrop="false">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header bg-dark text-white">

                    <h5 class="modal-title">
                        Crear Categoría
                    </h5>

                    <button type="button"
                            class="close text-white"
                            data-dismiss="modal">

                        &times;

                    </button>

                </div>

                <div class="modal-body">

                    <form>

                        <input type="hidden" id="categoria-id">

                        <div class="form-group">

                            <label>Nombre</label>

                            <input type="text"
                                   class="form-control"
                                   id="nombre-categoria"
                                   required>

                        </div>

                        <div class="form-group">

                            <label>Descripción</label>

                            <textarea class="form-control"
                                      id="descripcion-categoria"
                                      rows="3"></textarea>

                        </div>

                        <div class="text-right mt-4">

                            <button type="submit"
                                    class="btn btn-info">

                                Guardar

                            </button>

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-dismiss="modal">

                                Cancelar

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
