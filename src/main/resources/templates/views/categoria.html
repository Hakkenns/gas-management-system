<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="content"
         data-modulo="categorias"
         data-page-title="Gestion de Categorias">

        <div class="content p-3">

            <h3>
                <i class="fas fa-tags"></i>
                <strong>Gestión de Categorías</strong>
            </h3>

            <hr>

            <button id="btn-crear-categoria" type="button" class="btn btn-info mb-3">
                <i class="fas fa-plus"></i>
                Nueva Categoría
            </button>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 p-2 bg-light rounded border">
                <!-- Selector de registros por página (izquierda) -->
                <div class="d-flex align-items-center">
                    <label class="mr-2 mb-0 font-weight-bold text-sm">Mostrar</label>
                    <select id="categorias-length" class="form-control form-control-sm" style="width: auto;">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="40">40</option>
                        <option value="50">50</option>
                    </select>
                    <span class="ml-2 mb-0 text-sm">registros</span>
                </div>

                <!-- Buscador (derecha) -->
                <div class="d-flex align-items-center ml-auto mt-2 mt-md-0">
                    <label class="mr-2 mb-0 font-weight-bold text-sm">Buscar:</label>
                    <input type="search" id="categorias-search" class="form-control form-control-sm" style="width: 200px;">
                </div>
            </div>

            <div id="contenedor-tabla-categoria">

                <table class="table table-bordered table-striped" id="tabla-categorias">

                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Medida Base</th> <!-- Informativo para control del dueño -->
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-categorias-body" th:fragment="tablaCategorias">

                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="6" class="text-center">
                                No hay categorías registradas
                            </td>
                        </tr>

                        <tr th:each="c : ${categorias}">

                            <td th:text="${c.id}"></td>
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.descripcion}"></td>

                            <!-- Columna visual para ver la unidad configurada internamente -->
                            <td>
                                <span class="badge badge-light" th:text="${c.unidadMedida}"></span>
                            </td>

                            <td>
                                <span class="badge badge-success" th:if="${c.estado == 1}">
                                    ACTIVO
                                </span>
                                <span class="badge badge-danger" th:if="${c.estado == 0}">
                                    INACTIVO
                                </span>
                            </td>

                            <td>
                                <!-- 1. Editar -->
                                <button type="button" class="btn btn-warning btn-sm btn-editar-categoria"
                                    th:attr="data-id=${c.id},
                                             data-nombre=${c.nombre},
                                             data-descripcion=${c.descripcion},
                                             data-unidadmedida=${c.unidadMedida},
                                             data-tipounidad=${c.unidadMedida == 'KG' ? 'POR KILOS (KG)' : 
                                                              (c.unidadMedida == 'L' ? 'POR LITROS (L)' : 
                                                              (c.unidadMedida == 'M' ? 'POR METROS (M)' : 'POR UNIDADES / PIEZAS'))}">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <!-- 2. Habilitar/Deshabilitar -->
                                <button type="button" class="btn btn-secondary btn-sm btn-cambiar-estado-categoria"
                                    th:if="${c.estado == 1}" th:attr="data-id=${c.id},data-estado=0">
                                    <i class="fas fa-ban"></i>
                                </button>

                                <button type="button" class="btn btn-success btn-sm btn-cambiar-estado-categoria"
                                    th:if="${c.estado == 0}" th:attr="data-id=${c.id},data-estado=1">
                                    <i class="fas fa-check"></i>
                                </button>

                                <!-- 3. Ver Capacidades (solo si no es UND) -->
                                <button type="button" class="btn btn-info btn-sm btn-ver-capacidades"
                                    th:if="${c.unidadMedida != 'UND'}"
                                    th:attr="data-id=${c.id}, data-nombre=${c.nombre}"
                                    title="Ver capacidades">
                                    <i class="fas fa-boxes"></i>
                                </button>

                                <!-- 4. Eliminar -->
                                <button type="button" class="btn btn-danger btn-sm btn-eliminar-categoria"
                                    th:attr="data-id=${c.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>
        </div>

        <div class="modal fade" id="modal-categoria" tabindex="-1" data-backdrop="false">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header bg-dark">
                        <h5 class="modal-title text-white" id="modal-titulo-categoria">
                            Nueva Categoría
                        </h5>
                        <button type="button" class="close text-white" data-dismiss="modal">
                            &times;
                        </button>
                    </div>

                    <div class="modal-body">

                        <form th:action="@{/categorias}" method="post" id="form-categoria">

                            <input type="hidden" id="categoria-id" name="id">

                            <div class="form-group">
                                <label>Nombre de Categoría</label>
                                <input type="text" class="form-control" id="nombre-categoria" name="nombre" required>
                            </div>

                            <div class="form-group mt-2">
                                <label for="tipoUnidad" class="form-label">Forma de Venta / Tipo de Unidad</label>
                                <select class="form-control" id="tipoUnidad" name="tipoUnidad" required>
                                    <option value="" disabled selected>-- Seleccione una opción --</option>
                                    <option value="POR UNIDADES / PIEZAS">Por Unidades / Piezas</option>
                                    <option value="POR KILOS (KG)">Por Kilos (KG)</option>
                                    <option value="POR LITROS (L)">Por Litros (L)</option>
                                    <option value="POR METROS (M)">Por Metros (M)</option>
                                </select>
                                <input type="hidden" id="tipoUnidad-hidden" name="tipoUnidadHidden" value="">
                            </div>

                            <!-- SECCIÓN COMPACTA DE CAPACIDADES (solo si requiere_capacidad está activo) -->
                            <div class="form-group mt-2" id="contenedor-capacidades-categoria" style="display: none;">
                                <label class="d-block">Capacidades Disponibles</label>
                                <div class="input-group input-group-sm mb-2">
                                    <input type="number" step="0.01" min="0" class="form-control" id="input-nueva-capacidad" placeholder="">
                                    <div class="input-group-append">
                                        <button type="button" class="btn btn-success" id="btn-agregar-capacidad">
                                            <i class="fas fa-plus"></i> Agregar
                                        </button>
                                    </div>
                                </div>
                                <div id="lista-capacidades-categoria" class="d-flex flex-wrap gap-1" style="gap: 4px;">
                                    <!-- Aquí se renderizarán las badges de capacidades -->
                                </div>
                                <input type="hidden" id="capacidades-json" name="capacidades" value="[]">
                            </div>

                            <div class="form-group mt-2">
                                <label>Descripción</label>
                                <textarea class="form-control" id="descripcion-categoria" name="descripcion"></textarea>
                            </div>

                            <div class="text-right mt-4">
                                <button type="submit" class="btn btn-info">
                                    Guardar
                                </button>
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">
                                    Cancelar
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

        <!-- MODAL DE VISTA DE CAPACIDADES -->
        <div class="modal fade" id="modal-ver-capacidades" tabindex="-1" data-backdrop="false">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header bg-info">
                        <h5 class="modal-title text-white">
                            <i class="fas fa-boxes"></i>
                            Capacidades: <span id="modal-cap-nombre" class="badge badge-light text-dark ml-1">--</span>
                        </h5>
                        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="contenedor-lista-capacidades" class="text-center">
                            <p class="text-muted mb-0" id="texto-cargando-cap">Cargando...</p>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/assets/js/categoria.js}"></script>

    </div>

</body>

</html>
