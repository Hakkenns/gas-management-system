<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content"
         data-modulo="envasesMaestro"
         data-page-title="Catalogo de Envases">
        <div class="content p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3 class="mb-0"><i class="fas fa-gas-pump"></i> <strong>Catálogo de Envases</strong></h3>
                    <small class="text-muted">Administración de los envases disponibles.</small>
                </div>
                <button type="button" class="btn btn-info" id="btn-nuevo-envase">
                    <i class="fas fa-plus"></i> Nuevo Envase
                </button>
            </div>

            <div class="card card-outline card-info">
                <div class="card-body table-responsive p-0">
                    <table class="table table-bordered table-striped mb-0" id="tabla-envases-maestro">
                        <thead class="thead-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Capacidad</th>
                                <th>Unidad de Medida</th>
                                <th>Precio Envase</th>
                                <th>Stock Inicial</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-envases-maestro"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modal-envase-maestro" tabindex="-1" data-backdrop="false">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title" id="titulo-modal-envase">Nuevo Envase</h5>
                        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                    </div>
                    <form id="form-envase-maestro">
                        <div class="modal-body">
                            <input type="hidden" id="envase-id">
                            <div class="form-group">
                                <label for="envase-nombre">Nombre</label>
                                <input id="envase-nombre" class="form-control" maxlength="100" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="envase-capacidad">Capacidad</label>
                                    <input id="envase-capacidad" type="number" step="0.01" min="0" class="form-control" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="envase-unidad">Unidad de Medida</label>
                                    <input id="envase-unidad" class="form-control" maxlength="20" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <label for="envase-precio-envase">Precio Envase</label>
                                    <input id="envase-precio-envase" type="number" step="0.01" min="0" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="envase-stock-inicial">Stock Inicial</label>
                                <input id="envase-stock-inicial" type="number" min="0" step="1" class="form-control" value="0" required>
                            </div>
                            <div class="form-group">
                                <label for="envase-descripcion">Descripción</label>
                                <textarea id="envase-descripcion" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-info">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script th:src="@{/assets/js/envases-maestro.js}"></script>
    </div>
</body>

</html>
