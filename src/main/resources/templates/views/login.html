<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- BOOTSTRAP -->
    <link rel="stylesheet"
          th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous" />

    <!-- FONT AWESOME (local + CDN fallback) -->
    <link rel="stylesheet"
          th:href="@{/assets/plugins/fontawesome/css/all.min.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          crossorigin="anonymous" />

    <!-- CSS LOGIN -->
    <link rel="stylesheet"
          th:href="@{/assets/css/login.css}">

</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="login-box">

            <!-- FORM LOGIN -->
            <form id="form-login">

                <!-- LOGO -->
                <div class="text-center mb-3">

                    <img th:src="@{/img/logo.png}"
                         class="logo"
                         alt="Logo">

                </div>

                <!-- TITULOS -->
                <p class="bienvenida">
                    Bienvenido
                </p>

                <p class="subtexto">
                    Ingresa a tu cuenta
                </p>

                <!-- USERNAME -->
                <div class="input-group-custom">

                    <i class="fas fa-user"></i>

                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control-custom"
                           placeholder=" "
                           required>

                    <label for="username">Usuario</label>

                </div>

                <!-- PASSWORD -->
                <div class="input-group-custom">

                    <i class="fas fa-lock"></i>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control-custom"
                           placeholder=" "
                           required>

                    <label for="password">Contraseña</label>

                    <!-- Ojo para mostrar/ocultar contraseña -->
                    <i class="fas fa-eye toggle-password"
                       onclick="togglePassword()"
                       aria-hidden="true"></i>

                </div>

                <!-- BOTON -->
                <button type="button"
                        id="btn-login"
                        class="btn btn-primary w-100 login-btn">

                    Ingresar

                </button>

                <!-- FOOTER -->
                <p class="footer-text">
                    © 2026 Sistema de Gestión
                </p>

            </form>

        </div>

    </div>

    <!-- BOOTSTRAP JS -->
    <script th:src="@{/assets/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- JS LOGIN -->
    <script th:src="@{/assets/js/login.js}"></script>

</body>
</html>
