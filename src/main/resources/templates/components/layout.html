<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sistema Gas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" th:href="@{/assets/adminlte/plugins/fontawesome-free/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/assets/adminlte/dist/css/adminlte.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/assets/adminlte/plugins/datatables-bs4/css/dataTables.bootstrap4.css}">

    <!-- jQuery y Bootstrap van PRIMERO -->
    <script th:src="@{/assets/adminlte/plugins/jquery/jquery.min.js}"></script>
    <script th:src="@{/assets/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/assets/adminlte/plugins/datatables/jquery.dataTables.min.js}"></script>
    <script th:src="@{/assets/adminlte/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
    <script th:src="@{/assets/adminlte/dist/js/adminlte.min.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var sidebar = document.querySelector('.main-sidebar');
            var body = document.body;
            if (!sidebar || !body) return;

            sidebar.addEventListener('mouseenter', function() {
                body.classList.remove('sidebar-collapse');
            });
            sidebar.addEventListener('mouseleave', function() {
                body.classList.add('sidebar-collapse');
            });
        });
    </script>

    <!-- URL REAL Y COMPLETA DE SWEETALERT2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- WebSocket Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        /* Toasters flotantes para incidencias */
        #toast-container-bottom {
            position: fixed;
            bottom: 20px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 520px;
        }
        .custom-toast {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: showSlide 0.4s ease forwards;
            width: 460px;
            min-width: 460px;
            max-width: 460px;
            font-family: 'Inter', 'Poppins', 'Source Sans Pro', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .custom-toast .toast-header {
            background-color: #dc3545;
            color: #ffffff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .custom-toast .toast-header .toast-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .custom-toast .toast-header .toast-header-icon {
            font-size: 1.4rem;
        }
        .custom-toast .toast-header .toast-header-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .custom-toast .toast-header .toast-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .custom-toast .toast-header .toast-header-time {
            font-size: 0.85rem;
            opacity: 0.95;
            font-weight: 600;
        }
        .custom-toast .toast-header .toast-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .custom-toast .toast-header .toast-close:hover {
            background: rgba(255,255,255,0.25);
        }
        .custom-toast .toast-body {
            padding: 18px 20px;
            background: #f8f9fa;
            color: #212529;
        }
        .custom-toast .toast-body .toast-empleado {
            font-weight: 700;
            font-size: 1.05rem;
            color: #000000;
            margin-bottom: 4px;
        }
        .custom-toast .toast-body .toast-unidad {
            font-size: 0.9rem;
            color: #343a40;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .custom-toast .toast-body .toast-accion {
            font-size: 1.1rem;
            color: #212529;
            margin: 0;
            line-height: 1.5;
            font-weight: 400;
        }
        .custom-toast.hide-slide {
            animation: hideSlide 0.4s ease forwards;
        }
        @keyframes showSlide {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes hideSlide {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }
        .flash-highlight {
            animation: flashHighlight 2s ease-out;
        }
        @keyframes flashHighlight {
            0% { 
                background-color: rgba(0, 123, 255, 0.1);
                border-left-width: 5px;
            }
            100% { 
                background-color: transparent;
                border-left-width: 4px;
            }
        }
        .notif-item-emergency {
            border-left: 4px solid #dc3545 !important;
        }
        .notif-item-warning {
            border-left: 4px solid #ffc107 !important;
        }
        .notif-item-cliente-ausente {
            border-left: 4px solid #17a2b8 !important;
        }
        
        /* Estilos para el dropdown de notificaciones rediseñado */
        .notif-card-custom {
            padding: 0 !important;
            border-bottom: 1px solid #e9ecef;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #ffffff;
        }
        .notif-card-custom:hover {
            background-color: #f8f9fa;
        }
        .notif-card-inner {
            padding: 16px 20px;
        }
        .notif-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .notif-badge-container {
            display: inline-flex;
            align-items: center;
        }
        .notif-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .notif-badge.badge-danger {
            background-color: #dc3545;
            color: #ffffff;
        }
        
        .notif-badge.badge-warning {
            background-color: #ffc107;
            color: #212529;
        }
        
        .notif-badge.badge-info {
            background-color: #17a2b8;
            color: #ffffff;
        }
        .notif-badge i {
            font-size: 0.9rem;
        }
        .notif-time {
            font-size: 0.8rem;
            color: #6c757d;
            font-weight: 600;
        }
        .notif-card-body {
            margin-bottom: 10px;
        }
        .notif-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-family: 'Inter', 'Poppins', 'Source Sans Pro', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .notif-info-icon {
            font-size: 0.85rem;
            color: #6c757d;
            width: 16px;
        }
        .notif-info-text {
            font-size: 0.9rem;
            color: #212529;
            font-weight: 500;
        }
        .notif-card-message {
            font-size: 0.9rem;
            color: #495057;
            font-style: italic;
            padding: 10px 14px;
            background-color: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 12px;
            line-height: 1.5;
            font-family: 'Inter', 'Poppins', 'Source Sans Pro', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .notif-card-action {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .notif-card-action .btn-outline-secondary {
            opacity: 1 !important;
            visibility: visible !important;
            transition: none !important;
        }
        .notif-card-action .btn-outline-secondary:hover {
            opacity: 1 !important;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-outline-info {
            color: #17a2b8;
            border-color: #17a2b8;
            background: transparent;
        }
        .btn-outline-info:hover {
            background-color: #17a2b8;
            color: #ffffff;
            border-color: #17a2b8;
        }
        .btn-notif-action {
            display: block;
            width: 100%;
            padding: 10px 16px;
            background-color: #ffffff;
            border: 2px solid #dc3545;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', 'Poppins', 'Source Sans Pro', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Botón rojo para incidencias críticas (accidentes/averías) */
        .btn-notif-action.btn-danger {
            color: #dc3545;
            border-color: #dc3545;
        }
        .btn-notif-action.btn-danger:hover {
            background-color: #dc3545;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.2);
        }
        
        /* Botón amarillo para rechazos */
        .btn-notif-action.btn-warning {
            color: #212529;
            border-color: #ffc107;
        }
        .btn-notif-action.btn-warning:hover {
            background-color: #ffc107;
            color: #212529;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(255, 193, 7, 0.3);
        }
        
        /* Botón celeste para inconvenientes en puerta */
        .btn-notif-action.btn-info {
            color: #17a2b8;
            border-color: #17a2b8;
        }
        .btn-notif-action.btn-info:hover {
            background-color: #17a2b8;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(23, 162, 184, 0.2);
        }
        
        /* Botón amarillo personalizado para RECHAZO_DISTANCIA y RECHAZO_DIRECCION */
        .btn-rechazo-amarillo {
            border: 2px solid #ffc107 !important;
            color: #ffc107 !important;
            background: transparent !important;
            transition: all 0.3s ease !important;
        }
        .btn-rechazo-amarillo:hover {
            background-color: #ffc107 !important;
            color: #ffffff !important;
            border-color: #ffc107 !important;
        }
        
        .btn-notif-action i {
            margin-right: 6px;
        }
    </style>
</head>
<body class="hold-transition sidebar-mini sidebar-collapse">
<div class="wrapper">

    <div th:replace="components/header :: header"></div>
    <div th:replace="components/sidebar :: sidebar"></div>

    <div class="content-wrapper p-3">
        <div th:replace="~{${contenido} :: content}"></div>
    </div>

    <div th:replace="components/footer :: footer"></div>

    <!-- Toast container para notificaciones de incidencias -->
    <div id="toast-container-bottom"></div>

    <!-- Modal de Atención de Incidencia (Admin) -->
    <div class="modal fade" id="modal-atender-incidencia" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h6 class="modal-title"><i class="fas fa-exclamation-triangle"></i> Atender Incidencia</h6>

                <div class="modal-body">
                    <input type="hidden" id="atender-incidencia-id">

    <!-- Modal de Redirección a Motoasignación (Admin) -->
    <div class="modal fade" id="modal-redirigir-motoasignacion" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h6 class="modal-title"><i class="fas fa-motorcycle"></i> Redirigir Motoasignación y Auxiliar</h6>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="redirigir-incidencia-id">

                    <div class="form-group">
                        <label class="font-weight-bold text-sm">Moto disponible</label>
                        <select class="form-control" id="moto-redirigir-select">
                            <option value="">Cargando motos disponibles...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-dark" onclick="confirmarRedirigirMotoasignacion()">
                        <i class="fas fa-check"></i> Confirmar y Redirigir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Reasignación Rápida de Pedido (Admin) - Para RECHAZO_DISTANCIA y RECHAZO_DIRECCION -->
    <div class="modal fade" id="modal-reasignar-pedido" tabindex="-1" role="dialog" data-backdrop="static" data-keyboard="false" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h6 class="modal-title"><i class="fas fa-motorcycle"></i> Reasignar Pedido - <span id="reasignar-codigo-pedido">N/A</span></h6>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="reasignar-incidencia-id">
                    <input type="hidden" id="reasignar-pedido-id">
                    <p class="text-sm mb-3">Seleccione el nuevo repartidor para el pedido:</p>
                    <div class="form-group">
                        <label class="font-weight-bold text-sm">Repartidor disponible</label>
                        <select class="form-control" id="repartidor-reasignar-select">
                            <option value="">Cargando repartidores disponibles...</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-dark" onclick="confirmarReasignarPedido()">
                        <i class="fas fa-check"></i> Confirmar y Reasignar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== SISTEMA DE NOTIFICACIONES DE INCIDENCIAS (ADMIN) - WEBSOCKET ==========
        let ultimasIncidenciasIds = new Set();
        let adminNotifActivo = false;

        function iniciarNotificacionesAdmin() {
            if (adminNotifActivo) return;
            adminNotifActivo = true;
            
            // Cargar motos disponibles para el modal
            cargarMotosDisponibles();
            
            // Iniciar WebSocket para recibir notificaciones en tiempo real
            iniciarWebSocketIncidencia();
            
            // Cargar lista inicial de incidencias
            cargarListaIncidencias();
        }

        function iniciarWebSocketIncidencia() {
            try {
                const socket = new SockJS('/ws-admin');
                const stompClient = Stomp.over(socket);
                stompClient.debug = null;

                stompClient.connect({}, function(frame) {
                    console.log('WebSocket Admin conectado - Escuchando incidencias');

                    // Suscribirse al canal de contador de incidencias
                    stompClient.subscribe('/topic/admin/incidencias', function(message) {
                        const contador = parseInt(message.body);
                        if (!isNaN(contador)) {
                            actualizarBadgeAdmin(contador);
                            
                            // Si hay nuevas incidencias, recargar la lista completa
                            if (contador > 0) {
                                cargarListaIncidencias();
                            }
                        }
                    });

                    // Suscribirse al canal de detalle de incidencias (RECHAZO_POST_LLEGADA y CLIENTE_AUSENTE)
                    stompClient.subscribe('/topic/admin/incidencias/detalle', function(message) {
                        try {
                            const data = JSON.parse(message.body);
                            console.log('Nueva incidencia detallada recibida:', data);
                            // Recargar la lista de incidencias para mostrar la nueva
                            cargarListaIncidencias();
                        } catch (e) {
                            console.error('Error al procesar notificación detallada:', e);
                        }
                    });
                }, function(error) {
                    console.error('Error WebSocket Admin:', error);
                    setTimeout(iniciarWebSocketIncidencia, 10000);
                });
            } catch (e) {
                console.error('Error al crear WebSocket Admin:', e);
                setTimeout(iniciarWebSocketIncidencia, 10000);
            }
        }

        async function cargarListaIncidencias() {
            try {
                const res = await fetch('/api/incidencias/pendientes');
                const data = await res.json();
                if (!data.success) return;

                const incidencias = data.incidencias || [];
                const total = data.total || 0;

                // Actualizar badge
                const badge = document.getElementById('admin-badge-count');
                if (badge) {
                    if (total > 0) {
                        badge.textContent = total;
                        badge.style.display = 'inline';
                    } else {
                        badge.style.display = 'none';
                    }
                }

                // El encabezado ahora es estático, no se actualiza con el conteo

                // Actualizar lista del dropdown
                const list = document.getElementById('admin-notif-list');
                const dropdownToggle = document.getElementById('adminNotifDropdown');
                const dropdownParent = document.getElementById('admin-notif-dropdown');
                const dropdownMenu = dropdownParent ? dropdownParent.querySelector('.dropdown-menu') : null;
                
                if (list) {
                    list.innerHTML = '';
                    
                    // Si no hay incidencias, cerrar el dropdown si está abierto
                    if (incidencias.length === 0) {
                        if (dropdownParent && dropdownMenu) {
                            dropdownParent.classList.remove('show');
                            dropdownMenu.classList.remove('show');
                            if (dropdownToggle) {
                                dropdownToggle.setAttribute('aria-expanded', 'false');
                            }
                        }
                    } else {
                        // Poblar la lista con las incidencias
                        incidencias.forEach(inc => {
                            const esCritica = inc.tipoIncidencia === 'AVERIA_VEHICULO' || inc.tipoIncidencia === 'ACCIDENTE';
                            const esClienteAusente = inc.tipoIncidencia === 'CLIENTE_AUSENTE';
                            const itemClass = esCritica ? 'notif-item-emergency' : (esClienteAusente ? 'notif-item-cliente-ausente' : 'notif-item-warning');
                            
                            // Configurar icono y texto según tipo de incidencia
                            let icono = 'fa-exclamation-circle';
                            let tipoLabel = 'INCIDENCIA';
                            let textoReporte = 'El administrador revisará la incidencia.';
                            let badgeClass = 'badge-danger';
                            let btnClass = 'btn-danger';
                            let btnInlineStyle = '';
                            
                            if (inc.tipoIncidencia === 'AVERIA_VEHICULO') {
                                icono = 'fa-motorcycle';
                                tipoLabel = 'MOTO AVERIADA';
                                textoReporte = 'Mi motocicleta sufrió una falla mecánica severa. Solicito nueva unidad.';
                                badgeClass = 'badge-danger';
                                btnClass = 'btn-danger';
                            } else if (inc.tipoIncidencia === 'ACCIDENTE') {
                                icono = 'fa-ambulance';
                                tipoLabel = 'ACCIDENTE EN RUTA';
                                textoReporte = 'He tenido un accidente en ruta. Requiero apoyo de inmediato.';
                                badgeClass = 'badge-danger';
                                btnClass = 'btn-danger';
                            } else if (inc.tipoIncidencia === 'RECHAZO_DISTANCIA') {
                                icono = 'fa-times-circle';
                                tipoLabel = 'DISTANCIA EXCESIVA';
                                textoReporte = 'El repartidor reporta inconvenientes con la entrega: Distancia excesiva del punto';
                                badgeClass = 'badge-warning';
                                btnClass = 'btn-rechazo-amarillo';
                                btnInlineStyle = 'border: 2px solid #ffc107; color: #ffc107; background: transparent; transition: all 0.3s ease;';
                            } else if (inc.tipoIncidencia === 'RECHAZO_DIRECCION') {
                                icono = 'fa-times-circle';
                                tipoLabel = 'DIRECCIÓN ERRÓNEA O INACCESIBLE';
                                textoReporte = 'El repartidor reporta inconvenientes con la entrega: Dirección errónea o inaccesible';
                                badgeClass = 'badge-warning';
                                btnClass = 'btn-rechazo-amarillo';
                                btnInlineStyle = 'border: 2px solid #ffc107; color: #ffc107; background: transparent; transition: all 0.3s ease;';
                            } else if (inc.tipoIncidencia === 'INCONVENIENTE_PUERTA') {
                                icono = 'fa-door-closed';
                                tipoLabel = 'INCONVENIENTE EN PUERTA';
                                textoReporte = inc.motivoTexto || 'El repartidor informa de un inconveniente en el punto de entrega.';
                                badgeClass = 'badge-info';
                                btnClass = 'btn-info';
                            } else if (inc.tipoIncidencia === 'RECHAZO_POST_LLEGADA') {
                                icono = 'fa-times-circle';
                                tipoLabel = 'RECHAZO POST LLEGADA';
                                textoReporte = 'El motorizado reportó un rechazo de pedido del cliente en ' + (inc.codigoPedido || 'N/A');
                                badgeClass = 'badge-danger';
                                btnClass = 'btn-danger';
                            } else if (inc.tipoIncidencia === 'CLIENTE_AUSENTE') {
                                icono = 'fa-user-times';
                                tipoLabel = 'CLIENTE AUSENTE';
                                textoReporte = 'El pedido ' + (inc.codigoPedido || 'N/A') + ' no ha sido recibido por el cliente. El motorizado está en ruta o en espera.';
                                badgeClass = 'badge-info';
                                btnClass = 'btn-info';
                            }
                            
                            const hora = inc.createdAt ? new Date(inc.createdAt).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
                            
                            const item = document.createElement('div');
                            item.className = 'notif-card-custom ' + itemClass;
                            item.setAttribute('data-id', inc.id);
                            item.innerHTML = `
                                <div class="notif-card-inner">
                                    <!-- Encabezado con badge y hora -->
                                    <div class="notif-card-header">
                                        <div class="notif-badge-container">
                                            <span class="notif-badge ${badgeClass}">
                                                <i class="fas ${icono}"></i> ${tipoLabel}
                                            </span>
                                        </div>
                                        <span class="notif-time">${hora}</span>
                                    </div>
                                    
                                    <!-- Contenido de información -->
                                    <div class="notif-card-body">
                                        <div class="notif-info-row">
                                            <i class="fas fa-user notif-info-icon"></i>
                                            <span class="notif-info-text">${inc.empleadoNombre || 'Desconocido'}</span>
                                        </div>
                                        <div class="notif-info-row">
                                            <i class="fas fa-phone notif-info-icon"></i>
                                            <span class="notif-info-text">Número repartidor: <a href="tel:${inc.empleadoTelefono || ''}" class="text-dark font-weight-bold">${inc.empleadoTelefono || ''}</a></span>
                                        </div>
                                        ${inc.nombreCliente ? `
                                        <div class="notif-info-row">
                                            <i class="fas fa-user-tag notif-info-icon"></i>
                                            <span class="notif-info-text">Cliente: ${inc.nombreCliente}</span>
                                        </div>
                                        ` : ''}
                                        ${inc.celularCliente ? `
                                        <div class="notif-info-row">
                                            <i class="fas fa-phone notif-info-icon"></i>
                                            <span class="notif-info-text">Número cliente: <a href="tel:${inc.celularCliente}" class="text-dark font-weight-bold">${inc.celularCliente}</a></span>
                                        </div>
                                        ` : ''}
                                        ${inc.codigoPedido ? `
                                        <div class="notif-info-row">
                                            <i class="fas fa-box notif-info-icon"></i>
                                            <span class="notif-info-text">Pedido: ${inc.codigoPedido}</span>
                                        </div>
                                        ` : ''}
                                    </div>
                                    
                                    <!-- Mensaje predeterminado -->
                                    <div class="notif-card-message">
                                        <em>"${textoReporte}"</em>
                                    </div>
                                    
                                    <!-- Botones de acción -->
                                    <div class="notif-card-action d-flex gap-2 align-items-center">
                                        <button class="btn btn-outline-secondary btn-sm" style="padding: 6px 10px; min-width: 38px; height: 38px; display: inline-flex !important; align-items: center; justify-content: center; opacity: 1 !important; visibility: visible !important;" onclick="event.stopPropagation(); verEvidenciaIncidencia(${inc.id}, '${inc.urlEvidencia || ''}')" title="Ver Evidencia">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        ${inc.tipoIncidencia === 'CLIENTE_AUSENTE' ? `
                                        <button class="btn btn-outline-info btn-sm flex-fill" style="margin: 0; font-weight: 600; color: #17a2b8; border: 2px solid #17a2b8; background: transparent;" onclick="event.stopPropagation(); marcarComoRevisado(${inc.id})" onmouseover="this.style.backgroundColor='#17a2b8'; this.style.color='#ffffff';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#17a2b8';">
                                            <i class="fas fa-check"></i> Marcar como Revisado
                                        </button>
                                        ` : `
                                        <button class="btn-notif-action ${btnClass} flex-fill" style="${btnInlineStyle}; margin: 0;" onclick="event.stopPropagation(); abrirModalSegunTipoIncidencia(${inc.id}, '${inc.empleadoNombre || ''}', '${inc.tipoIncidencia}', ${inc.idPedido}, '${inc.codigoPedido || ''}')">
                                            <i class="fas fa-motorcycle"></i> ${inc.tipoIncidencia === 'RECHAZO_DISTANCIA' || inc.tipoIncidencia === 'RECHAZO_DIRECCION' ? 'Asignar Repartidor' : (inc.tipoIncidencia === 'RECHAZO_POST_LLEGADA' ? 'Confirmar Rechazo' : 'Redirigir Motoasignación y Auxiliar')}
                                        </button>
                                        `}
                                    </div>
                                </div>
                            `;
                            list.appendChild(item);
                        });
                    }
                }

                // Detectar nuevas incidencias y mostrar toasters
                incidencias.forEach(inc => {
                    if (!ultimasIncidenciasIds.has(inc.id)) {
                        ultimasIncidenciasIds.add(inc.id);
                        mostrarToastIncidencia(inc);
                    }
                });

                // Limpiar IDs que ya no están pendientes
                const idsActuales = new Set(incidencias.map(i => i.id));
                for (let id of ultimasIncidenciasIds) {
                    if (!idsActuales.has(id)) {
                        ultimasIncidenciasIds.delete(id);
                    }
                }

            } catch (e) {
                console.error('Error al cargar incidencias:', e);
            }
        }

        function actualizarBadgeAdmin(contador) {
            const badge = document.getElementById('admin-badge-count');
            if (badge) {
                if (contador > 0) {
                    badge.textContent = contador;
                    badge.style.display = 'inline';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        async function verEvidenciaIncidencia(idIncidencia, urlEvidencia) {
            if (!urlEvidencia) {
                Swal.fire({ title: 'Atención', text: 'No hay evidencia disponible para esta incidencia.', icon: 'warning' });
                return;
            }

            try {
                // Verificar que la URL sea accesible
                const res = await fetch(urlEvidencia, { method: 'HEAD' });
                if (!res.ok) {
                    Swal.fire({ title: 'Error', text: 'No se pudo cargar la evidencia.', icon: 'error' });
                    return;
                }

                // Mostrar modal con la imagen
                const modalHtml = `
                    <div class="modal fade" id="modal-evidencia-incidencia" tabindex="-1" role="dialog" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
                            <div class="modal-content">
                                <div class="modal-header bg-info text-white">
                                    <h6 class="modal-title"><i class="fas fa-eye"></i> Evidencia de Incidencia</h6>
                                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                                </div>
                                <div class="modal-body text-center">
                                    <img src="${urlEvidencia}" class="img-fluid rounded" style="max-height: 70vh;" alt="Evidencia de incidencia">
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Remover modal anterior si existe
                const modalAnterior = document.getElementById('modal-evidencia-incidencia');
                if (modalAnterior) modalAnterior.remove();

                // Insertar y mostrar el modal
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                $('#modal-evidencia-incidencia').modal('show');

                // Limpiar al cerrar
                $('#modal-evidencia-incidencia').on('hidden.bs.modal', function() {
                    $(this).remove();
                });
            } catch (e) {
                Swal.fire({ title: 'Error', text: 'Error al cargar la evidencia.', icon: 'error' });
                console.error('Error al cargar evidencia:', e);
            }
        }

        async function marcarComoRevisado(idIncidencia) {
            try {
                const res = await fetch('/api/incidencias/' + idIncidencia + '/marcar-revisado', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire({ 
                        title: 'Éxito', 
                        text: data.message, 
                        icon: 'success', 
                        timer: 1500, 
                        showConfirmButton: false 
                    });
                    
                    // Cerrar dropdown elegantemente antes de recargar
                    const dropdownParent = document.getElementById('admin-notif-dropdown');
                    const dropdownMenu = dropdownParent ? dropdownParent.querySelector('.dropdown-menu') : null;
                    const dropdownToggle = document.getElementById('adminNotifDropdown');
                    
                    if (dropdownParent) dropdownParent.classList.remove('show');
                    if (dropdownMenu) dropdownMenu.classList.remove('show');
                    if (dropdownToggle) dropdownToggle.setAttribute('aria-expanded', 'false');
                    
                    // Recargar lista después de cerrar el dropdown
                    setTimeout(() => cargarListaIncidencias(), 200);
                } else {
                    Swal.fire({ title: 'Error', text: data.message || 'Error al marcar como revisado', icon: 'error' });
                }
            } catch (e) {
                Swal.fire({ title: 'Error', text: 'Error de conexión', icon: 'error' });
            }
        }

        function mostrarToastIncidencia(inc) {
            const container = document.getElementById('toast-container-bottom');
            if (!container) return;

            // Configuración de color según tipo de incidencia
            let headerBgColor = '#dc3545'; // Rojo por defecto (ACCIDENTE/AVERIA)
            let headerTextColor = '#ffffff'; // Texto blanco por defecto
            let tipoLabel = 'INCIDENCIA';
            let icono = 'fa-exclamation-circle';
            let textoReporte = 'El administrador revisará la incidencia.';

            if (inc.tipoIncidencia === 'AVERIA_VEHICULO') {
                headerBgColor = '#dc3545'; // Rojo
                headerTextColor = '#ffffff';
                icono = 'fa-motorcycle';
                tipoLabel = 'MOTO AVERIADA';
                textoReporte = 'Mi motocicleta sufrió una falla mecánica severa. Solicito nueva unidad.';
            } else if (inc.tipoIncidencia === 'ACCIDENTE') {
                headerBgColor = '#dc3545'; // Rojo
                headerTextColor = '#ffffff';
                icono = 'fa-ambulance';
                tipoLabel = 'ACCIDENTE EN RUTA';
                textoReporte = 'He tenido un accidente en ruta. Requiero apoyo de inmediato.';
            } else if (inc.tipoIncidencia === 'RECHAZO_DISTANCIA') {
                headerBgColor = '#ffc107'; // Amarillo
                headerTextColor = '#212529'; // Texto oscuro
                icono = 'fa-times-circle';
                tipoLabel = 'DISTANCIA EXCESIVA';
                textoReporte = 'El repartidor reporta inconvenientes con la entrega: Distancia excesiva del punto';
            } else if (inc.tipoIncidencia === 'RECHAZO_DIRECCION') {
                headerBgColor = '#ffc107'; // Amarillo
                headerTextColor = '#212529'; // Texto oscuro
                icono = 'fa-times-circle';
                tipoLabel = 'DIRECCIÓN ERRÓNEA O INACCESIBLE';
                textoReporte = 'El repartidor reporta inconvenientes con la entrega: Dirección errónea o inaccesible';
            } else if (inc.tipoIncidencia === 'INCONVENIENTE_PUERTA') {
                headerBgColor = '#17a2b8'; // Celeste
                headerTextColor = '#ffffff';
                icono = 'fa-door-closed';
                tipoLabel = 'INCONVENIENTE EN PUERTA';
                textoReporte = inc.motivoTexto || 'El repartidor informa de un inconveniente en el punto de entrega.';
            } else if (inc.tipoIncidencia === 'CLIENTE_AUSENTE') {
                headerBgColor = '#17a2b8'; // Celeste
                headerTextColor = '#ffffff';
                icono = 'fa-user-times';
                tipoLabel = 'CLIENTE AUSENTE';
                textoReporte = 'El pedido ' + (inc.codigoPedido || 'N/A') + ' no ha sido recibido por el cliente. El motorizado está en ruta o en espera.';
            }

            const hora = inc.createdAt ? new Date(inc.createdAt).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';

            // Datos del empleado: "Luis Torres - Unidad #03"
            const nombreEmpleado = inc.empleadoNombre || 'Desconocido';
            const unidadEmpleado = inc.empleadoTelefono ? 'Unidad #' + inc.empleadoTelefono : '';
            const empleadoTexto = unidadEmpleado ? nombreEmpleado + ' - ' + unidadEmpleado : nombreEmpleado;

            const toast = document.createElement('div');
            toast.className = 'custom-toast show-slide';
            toast.setAttribute('data-id', inc.id);
            toast.innerHTML = `
                <div class="toast-header" style="background-color: ${headerBgColor}; color: ${headerTextColor};">
                    <div class="toast-header-left">
                        <span class="toast-header-icon"><i class="fas ${icono}"></i></span>
                        <span class="toast-header-title">${tipoLabel}</span>
                    </div>
                    <div class="toast-header-right">
                        <span class="toast-header-time">${hora}</span>
                        <button class="toast-close" style="color: ${headerTextColor};" onclick="event.stopPropagation(); this.closest('.custom-toast').remove();">&times;</button>
                    </div>
                </div>
                <div class="toast-body">
                    <div class="toast-empleado">${empleadoTexto}</div>
                    <div class="toast-unidad">${inc.codigoPedido ? 'Pedido: ' + inc.codigoPedido : ''}</div>
                    <p class="toast-accion">${textoReporte}</p>
                </div>
            `;

            toast.onclick = function() {
                toast.classList.remove('show-slide');
                toast.classList.add('hide-slide');
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 400);
                
                // Forzar apertura del dropdown manipulando clases de Bootstrap
                const dropdownToggle = document.getElementById('adminNotifDropdown');
                const dropdownParent = document.getElementById('admin-notif-dropdown');
                const dropdownMenu = dropdownToggle ? dropdownToggle.nextElementSibling : null;
                
                if (dropdownParent && dropdownMenu) {
                    // Añadir clase 'show' al contenedor padre y al menú
                    dropdownParent.classList.add('show');
                    dropdownMenu.classList.add('show');
                    
                    // Actualizar atributo aria-expanded
                    dropdownToggle.setAttribute('aria-expanded', 'true');
                }
                
                // Esperar a que el dropdown se despliegue y luego resaltar el item
                setTimeout(() => {
                    const item = document.querySelector('#admin-notif-list div[data-id="' + inc.id + '"]');
                    if (item) {
                        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        item.classList.add('flash-highlight');
                        setTimeout(() => item.classList.remove('flash-highlight'), 2000);
                    }
                }, 100);
            };

            container.appendChild(toast);

            // Auto-eliminar después de 8 segundos
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.remove('show-slide');
                    toast.classList.add('hide-slide');
                    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 400);
                }
            }, 8000);
        }

        async function cargarMotosDisponibles() {
            try {
                const res = await fetch('/api/incidencias/motos-disponibles');
                const data = await res.json();
                if (!data.success) return;
                const select = document.getElementById('moto-reemplazo-select');
                if (!select) return;
                select.innerHTML = '<option value="">Seleccione una moto...</option>';
                (data.motos || []).forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.placa + ' - ' + m.marca + ' ' + m.modelo;
                    opt.textContent = m.placa + ' - ' + m.marca + ' ' + m.modelo;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error al cargar motos:', e);
            }
        }

        function abrirModalAtender(id, empleadoNombre, tipoIncidencia) {
            document.getElementById('atender-incidencia-id').value = id;
            const tipoLabel = tipoIncidencia === 'AVERIA_VEHICULO' ? 'Avería de vehículo' :
                             tipoIncidencia === 'ACCIDENTE' ? 'Accidente en ruta' : 'Rechazo';
            document.querySelector('#modal-atender-incidencia .modal-title').innerHTML =
                '<i class="fas fa-exclamation-triangle"></i> Atender: ' + tipoLabel + ' - ' + empleadoNombre;
            $('#modal-atender-incidencia').modal('show');
        }

        function abrirModalRedirigirMotoasignacion(id, empleadoNombre, tipoIncidencia) {
            document.getElementById('redirigir-incidencia-id').value = id;
            const tipoLabel = tipoIncidencia === 'AVERIA_VEHICULO' ? 'Avería de vehículo' :
                             tipoIncidencia === 'ACCIDENTE' ? 'Accidente en ruta' : 'Rechazo';
            document.querySelector('#modal-redirigir-motoasignacion .modal-title').innerHTML =
                '<i class="fas fa-motorcycle"></i> Redirigir: ' + tipoLabel + ' - ' + empleadoNombre;
            
            // Cargar motos disponibles
            cargarMotosDisponiblesRedirigir();
            
            $('#modal-redirigir-motoasignacion').modal('show');
        }

        async function cargarMotosDisponiblesRedirigir() {
            try {
                const res = await fetch('/api/incidencias/motos-disponibles');
                const data = await res.json();
                if (!data.success) return;
                const select = document.getElementById('moto-redirigir-select');
                if (!select) return;
                select.innerHTML = '<option value="">Seleccione una moto...</option>';
                (data.motos || []).forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.placa + ' - ' + m.marca + ' ' + m.modelo;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error al cargar motos:', e);
            }
        }

        async function confirmarRedirigirMotoasignacion() {
            const id = document.getElementById('redirigir-incidencia-id').value;
            const motoSelect = document.getElementById('moto-redirigir-select');
            const moto = motoSelect.value;
            const motoTexto = motoSelect.options[motoSelect.selectedIndex]?.text || '';

            if (!moto) {
                Swal.fire({ title: 'Atención', text: 'Seleccione una moto de reemplazo.', icon: 'warning' });
                return;
            }

            try {
                const res = await fetch('/api/incidencias/' + id + '/atender', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        motoReemplazo: motoTexto,
                        idMotoNueva: parseInt(moto)
                    })
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire({ 
                        title: 'Operación Exitosa', 
                        text: data.message, 
                        icon: 'success', 
                        timer: 3000, 
                        showConfirmButton: false 
                    });
                    $('#modal-redirigir-motoasignacion').modal('hide');
                    motoSelect.value = '';
                    cargarListaIncidencias();
                } else {
                    Swal.fire({ title: 'Error', text: data.message || 'Error al atender', icon: 'error' });
                }
            } catch (e) {
                Swal.fire({ title: 'Error', text: 'Error de conexión', icon: 'error' });
            }
        }

        async function confirmarAtenderIncidencia() {
            const id = document.getElementById('atender-incidencia-id').value;
            const moto = document.getElementById('moto-reemplazo-select').value;

            if (!moto) {
                Swal.fire({ title: 'Atención', text: 'Selecciona una moto de reemplazo.', icon: 'warning' });
                return;
            }

            try {
                const res = await fetch('/api/incidencias/' + id + '/atender', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ motoReemplazo: moto })
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire({ title: 'Auxilio enviado', text: 'La incidencia fue atendida correctamente.', icon: 'success', timer: 1500, showConfirmButton: false });
                    $('#modal-atender-incidencia').modal('hide');
                    document.getElementById('moto-reemplazo-select').value = '';
                    cargarListaIncidencias();
                } else {
                    Swal.fire({ title: 'Error', text: data.message || 'Error al atender', icon: 'error' });
                }
            } catch (e) {
                Swal.fire({ title: 'Error', text: 'Error de conexión', icon: 'error' });
            }
        }

        // ========== FUNCIONES PARA REASIGNACIÓN RÁPIDA DE PEDIDO (RECHAZOS) ==========

        function abrirModalSegunTipoIncidencia(id, empleadoNombre, tipoIncidencia, idPedido, codigoPedido) {
            // Para RECHAZO_DISTANCIA y RECHAZO_DIRECCION abrir el modal de reasignación de pedido
            if (tipoIncidencia === 'RECHAZO_DISTANCIA' || tipoIncidencia === 'RECHAZO_DIRECCION') {
                document.getElementById('reasignar-incidencia-id').value = id;
                document.getElementById('reasignar-pedido-id').value = idPedido || '';
                document.getElementById('reasignar-codigo-pedido').textContent = codigoPedido || 'N/A';
                document.querySelector('#modal-reasignar-pedido .modal-title').innerHTML =
                    '<i class="fas fa-motorcycle"></i> Reasignar Pedido - ' + (codigoPedido || 'N/A');
                
                // Cargar repartidores disponibles
                cargarRepartidoresDisponibles();
                
                $('#modal-reasignar-pedido').modal('show');
            } else {
                // Para AVERIA_VEHICULO, ACCIDENTE, INCONVENIENTE_PUERTA usar el modal de motoasignación existente
                abrirModalRedirigirMotoasignacion(id, empleadoNombre, tipoIncidencia);
            }
        }

        async function cargarRepartidoresDisponibles() {
            try {
                const res = await fetch('/api/incidencias/repartidores-disponibles');
                const data = await res.json();
                if (!data.success) return;
                const select = document.getElementById('repartidor-reasignar-select');
                if (!select) return;
                select.innerHTML = '<option value="">Seleccione un repartidor...</option>';
                (data.repartidores || []).forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.id;
                    opt.textContent = r.nombre + (r.telefono ? ' - ' + r.telefono : '');
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error al cargar repartidores:', e);
            }
        }

        async function confirmarReasignarPedido() {
            const id = document.getElementById('reasignar-incidencia-id').value;
            const repartidorSelect = document.getElementById('repartidor-reasignar-select');
            const idNuevoRepartidor = repartidorSelect.value;

            if (!idNuevoRepartidor) {
                Swal.fire({ title: 'Atención', text: 'Seleccione un repartidor.', icon: 'warning' });
                return;
            }

            try {
                const res = await fetch('/api/incidencias/' + id + '/reasignar-pedido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        idNuevoRepartidor: parseInt(idNuevoRepartidor)
                    })
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire({ 
                        title: 'Operación Exitosa', 
                        text: data.message, 
                        icon: 'success', 
                        timer: 3000, 
                        showConfirmButton: false 
                    });
                    $('#modal-reasignar-pedido').modal('hide');
                    repartidorSelect.value = '';
                    cargarListaIncidencias();
                } else {
                    Swal.fire({ title: 'Error', text: data.message || 'Error al reasignar', icon: 'error' });
                }
            } catch (e) {
                Swal.fire({ title: 'Error', text: 'Error de conexión', icon: 'error' });
            }
        }

        // Limpiar estado del modal de reasignación cuando se cierra (incluso con backdrop estático)
        document.addEventListener('DOMContentLoaded', function() {
            var modalReasignar = document.getElementById('modal-reasignar-pedido');
            if (modalReasignar) {
                modalReasignar.addEventListener('hidden.bs.modal', function() {
                    // Limpiar campos del modal
                    document.getElementById('reasignar-incidencia-id').value = '';
                    document.getElementById('reasignar-pedido-id').value = '';
                    document.getElementById('reasignar-codigo-pedido').textContent = 'N/A';
                    
                    // Resetear el select a su estado inicial
                    var select = document.getElementById('repartidor-reasignar-select');
                    if (select) {
                        select.innerHTML = '<option value="">Cargando repartidores disponibles...</option>';
                    }
                    
                    // Remover cualquier backdrop huérfano que haya quedado en el DOM
                    var backdrops = document.querySelectorAll('.modal-backdrop');
                    backdrops.forEach(function(bd) {
                        bd.remove();
                    });
                    
                    // Restaurar la clase modal-open en el body solo si no hay otros modales abiertos
                    var modalesAbiertos = document.querySelectorAll('.modal.show');
                    if (modalesAbiertos.length === 0) {
                        document.body.classList.remove('modal-open');
                        document.body.style.overflow = '';
                        document.body.style.paddingRight = '';
                    }
                });
            }
        });

        // Iniciar notificaciones cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si estamos en una página de administración (tiene sidebar)
            if (document.querySelector('.main-sidebar')) {
                iniciarNotificacionesAdmin();
            }
        });
    </script>
</div>
