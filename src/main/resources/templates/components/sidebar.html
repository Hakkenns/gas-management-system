<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar"
       class="main-sidebar sidebar-dark-primary elevation-4">

    <a th:href="@{/}" class="brand-link text-center">

        <span class="brand-text font-weight-dark">
            <strong>Sistema Ventas</strong>
        </span>

    </a>

    <div class="sidebar">

        <nav class="mt-2">

            <ul class="nav nav-pills nav-sidebar flex-column">

                <li class="nav-item"
                    th:each="opcion : ${menu}">

                    <a th:href="@{${opcion.ruta}}"
                       class="nav-link">

                        <i class="nav-icon"
                           th:classappend="${opcion.icono}"></i>

                        <p th:text="${opcion.nombre}"></p>

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</aside>
</body>
</html>
