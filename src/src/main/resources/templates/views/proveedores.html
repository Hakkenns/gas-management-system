<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="content">

        <div class="content p-3">

            <h3>
                <i class="fas fa-truck"></i>
                <strong>Gestión de Proveedores</strong>
            </h3>

            <hr>

            <button id="btn-crear-proveedor" class="btn btn-info mb-3" data-toggle="modal"
                data-target="#modal-proveedor">
                <i class="fas fa-plus"></i>
                Nuevo Proveedor
            </button>

            <div id="contenedor-tabla">
                <table class="table table-bordered table-striped" id="tabla-proveedores" th:fragment="tablaProveedores">

                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>RUC</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Rubro</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:if="${#lists.isEmpty(proveedores)}">
                            <td colspan="8" class="text-center">
                                No hay proveedores registrados
                            </td>
                        </tr>

                        <tr th:each="p : ${proveedores}">

                            <td th:text="${p.id}"></td>
                            <td th:text="${p.ruc}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td th:text="${p.telefono}"></td>
                            <td th:text="${p.correo}"></td>
                            <td th:text="${p.nombreRubro}"></td>

                            <td>
                                <span class="badge badge-success" th:if="${p.estado == 1}">ACTIVO</span>
                                <span class="badge badge-danger" th:if="${p.estado == 0}">INACTIVO</span>
                            </td>

                            <td>
                                <button type="button" class="btn btn-warning btn-sm btn-editar-proveedor"
                                    th:data-id="${p.id}" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <button type="button" th:if="${p.estado == 1}"
                                    class="btn btn-secondary btn-sm btn-cambiar-estado" th:data-id="${p.id}"
                                    th:data-estado="${p.estado}">
                                    <i class="fas fa-ban"></i>
                                </button>

                                <button type="button" th:if="${p.estado == 0}"
                                    class="btn btn-success btn-sm btn-cambiar-estado" th:data-id="${p.id}"
                                    th:data-estado="${p.estado}">
                                    <i class="fas fa-check"></i>
                                </button>

                                <button type="button" class="btn btn-danger btn-sm btn-eliminar-proveedor"
                                    th:data-id="${p.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="modal fade" id="modal-proveedor" tabindex="-1" data-backdrop="false">

            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header bg-dark">
                        <h5 class="modal-title text-white" id="modal-titulo-proveedor">
                            Nuevo Proveedor
                        </h5>
                        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                    </div>

                    <div class="modal-body">
                        <form id="form-proveedor" th:action="@{/proveedores}" method="post">

                            <input type="hidden" id="input-id" name="id">

                            <div class="form-group">
                                <label>RUC</label>
                                <input type="text" class="form-control" id="input-ruc" name="ruc" maxlength="11"
                                    required>
                            </div>

                            <div class="form-group">
                                <label>Nombre / Razón Social</label>
                                <input type="text" class="form-control" id="input-nombre" name="nombre" required>
                            </div>

                            <div class="form-group">
                                <label>Teléfono</label>
                                <input type="text" class="form-control" id="input-telefono" name="telefono"
                                    maxlength="9" required>
                            </div>

                            <div class="form-group">
                                <label>Correo Electrónico</label>
                                <input type="email" class="form-control" id="input-correo" name="correo">
                            </div>

                            <div class="form-group">
                                <label>Rubro</label>
                                <select class="form-control" id="input-rubro" name="idRubro" required>
                                    <option value="">-- Seleccione un rubro --</option>
                                    <option th:each="r : ${rubros}" th:value="${r.id}" th:text="${r.nombre}">
                                    </option>
                                </select>
                            </div>

                            <div class="text-right mt-4">
                                <button type="submit" class="btn btn-info">Guardar</button>
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script th:src="@{/assets/js/proveedores.js}"></script>

    </div>

</body>

</html>
