<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="content">

    <div class="content p-3">

        <h3>
            <i class="fas fa-users-cog"></i>
            <strong>Gestión de Usuarios</strong>
        </h3>

        <hr>

        <!-- MENSAJE DE ERROR -->
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <!-- BOTON NUEVO -->
        <button class="btn btn-info mb-3" onclick="abrirModalNuevo()">
            <i class="fas fa-plus"></i>
            Nuevo Usuario
        </button>

        <!-- TABLA -->
        <table class="table table-bordered table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Perfil</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-usuarios" th:fragment="tablaUsuarios">

                <!-- VACÍO -->
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="text-center">No hay usuarios registrados.</td>
                </tr>

                <!-- LISTAR -->
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.nombre}"></td>
                    <td th:text="${u.userName}"></td>
                    <td th:text="${u.correo}"></td>
                    <td th:text="${u.nombrePerfil}"></td>
                    <td>
                        <span class="badge badge-success" th:if="${u.estado == 1}">Activo</span>
                        <span class="badge badge-danger"  th:if="${u.estado == 0}">Inactivo</span>
                    </td>
                    <td>
                        <!-- EDITAR -->
                        <button class="btn btn-warning btn-sm"
                                th:onclick="'abrirModalEditar(' + ${u.id} + ')'">
                            <i class="fas fa-edit"></i>
                        </button>

                        <!-- ACTIVAR -->
                        <button class="btn btn-success btn-sm"
                                th:if="${u.estado == 0}"
                                th:onclick="'cambiarEstado(' + ${u.id} + ', 1)'">
                            <i class="fas fa-check"></i>
                        </button>

                        <!-- DESACTIVAR -->
                        <button class="btn btn-secondary btn-sm"
                                th:if="${u.estado == 1}"
                                th:onclick="'cambiarEstado(' + ${u.id} + ', 0)'">
                            <i class="fas fa-ban"></i>
                        </button>

                        <!-- ELIMINAR -->
                        <button class="btn btn-danger btn-sm"
                                th:onclick="'eliminarUsuario(' + ${u.id} + ')'">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>

            </tbody>
        </table>

    </div>

    <!-- MODAL USUARIO -->
    <div class="modal fade" id="modal-usuario" tabindex="-1" data-backdrop="false">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-dark">
                    <h5 class="modal-title text-white" id="modal-titulo">Usuario</h5>
                    <button class="close text-white" data-dismiss="modal">&times;</button>
                </div>

                <div class="modal-body">

                    <form id="form-usuario" action="/usuarios" method="post">

                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" class="form-control"
                                   id="input-nombre" name="nombre">
                        </div>

                        <div class="form-group">
                            <label>Usuario</label>
                            <input type="text" class="form-control"
                                   id="input-username" name="userName">
                        </div>

                        <div class="form-group">
                            <label>Correo</label>
                            <input type="email" class="form-control"
                                   id="input-correo" name="correo"
                                   required
                                   pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                                   title="Ingrese un correo electrónico válido">
                        </div>

                        <div class="form-group">
                            <label>Perfil</label>
                            <select class="form-control"
                                    id="input-perfil" name="idPerfil">
                                <option value="">Seleccione un perfil</option>
                                <option th:each="p : ${perfiles}"
                                        th:value="${p.id}"
                                        th:text="${p.nombrePerfil}">
                                </option>
                            </select>
                        </div>

                        <!-- PASSWORD CON OJITO -->
                        <div class="form-group">
                            <label>Contraseña</label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="input-password"
                                       name="password"
                                       placeholder="Dejar vacío para mantener la actual">
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary"
                                            type="button"
                                            onclick="togglePassword()">
                                        <i class="fas fa-eye" id="icono-password"></i>
                                    </button>
                                </div>
                            </div>
                            <small class="text-muted">
                                Solo completa este campo si deseas cambiar la contraseña.
                            </small>
                        </div>

                        <div class="text-right">
                            <button type="submit" class="btn btn-info">Guardar</button>
                            <button type="button" class="btn btn-secondary"
                                    data-dismiss="modal">Cancelar</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAR ELIMINAR -->
    <div class="modal fade" id="modal-eliminar" tabindex="-1" data-backdrop="false">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">

                <div class="modal-header bg-danger">
                    <h5 class="modal-title text-white">Eliminar Usuario</h5>
                    <button class="close text-white" data-dismiss="modal">&times;</button>
                </div>

                <div class="modal-body text-center">
                    <p>¿Estás seguro de que deseas eliminar este usuario?</p>
                    <p class="text-muted">Esta acción no se puede deshacer.</p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger"
                            id="btn-confirmar-eliminar">Eliminar</button>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/assets/js/usuario.js}" defer></script>

</div>

</body>
</html>
